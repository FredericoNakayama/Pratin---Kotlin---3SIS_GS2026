# Memória da JVM do Gradle e codificação dos arquivos.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
# AndroidX e classes R não transitivas (padrão dos projetos novos).
android.useAndroidX=true
android.nonTransitiveRClass=true
# Estilo oficial de código Kotlin.
kotlin.code.style=official
# O AGP 9.1.0 (máximo aceito pelo Android Studio 2025.3) foi testado até a API 36.1, mas as
# bibliotecas atuais exigem compilar contra a API 37. O build e os testes passam; o aviso fica
# registrado aqui como conhecido. Ao atualizar o Android Studio/AGP, remova esta linha.
android.suppressUnsupportedCompileSdk=37.0
